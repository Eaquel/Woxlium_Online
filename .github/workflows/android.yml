name: Android APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NDK_VERSION: 28.2.13676358
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # the runner image already ships the Android SDK (ANDROID_HOME); just add what we need
      - name: Install SDK packages (platform 36, build-tools, NDK)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-36" "build-tools;36.0.0" "ndk;${NDK_VERSION}" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Set up Rust (Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/woxlium_core

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Rust unit tests
        working-directory: rust/woxlium_core
        run: cargo test --release

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify 16 KB alignment
        run: $ANDROID_HOME/build-tools/36.0.0/zipalign -c -P 16 4 app/build/outputs/apk/release/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: woxlium-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
