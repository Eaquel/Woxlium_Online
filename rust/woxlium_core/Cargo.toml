[package]
name = "woxlium_core"
version = "0.1.0"
edition = "2021"
description = "Woxlium zombie survival: simulation + OpenGL ES renderer (Android native library)"
publish = false

[lib]
name = "woxlium"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "preview"
path = "src/bin/preview.rs"
required-features = ["preview"]

[features]
# Desktop harness that renders frames off-screen through ANGLE (libEGL/libGLESv2).
preview = []

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
